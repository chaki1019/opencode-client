# Store release on Codemagic (see docs/release.md).
#
# Pushing a tag like v1.0.1 builds the iOS and Android release binaries and
# uploads them to TestFlight and the Play internal testing track. Pull
# request checks run on GitHub Actions (.github/workflows/ci.yml), so this
# workflow spends Codemagic's free macOS minutes on releases only.
workflows:
  release:
    name: Release (TestFlight + Play internal)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Name of the App Store Connect API key in Codemagic's team settings.
      app_store_connect: opencode-mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      java: 17
      groups:
        # PUSH_ENV_JSON, ADS_ENV_JSON, APP_ENV_JSON, ADMOB_IOS_APP_ID,
        # FIREBASE_APP_ID_FILE_JSON (optional)
        - app_config
        # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        - google_play
      android_signing:
        - upload_keystore
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.opencodemobile
      vars:
        PACKAGE_NAME: app.opencodemobile
        # The app's Apple ID from App Store Connect (App Information page).
        APP_STORE_APPLE_ID: "0000000000"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
      cancel_previous_builds: true
    scripts:
      - name: Write build settings
        script: |
          set -e
          printf '%s' "$PUSH_ENV_JSON" > push.env.json
          printf '%s' "$ADS_ENV_JSON" > ads.env.json
          printf '%s' "$APP_ENV_JSON" > app.env.json
          echo "ADMOB_IOS_APP_ID = $ADMOB_IOS_APP_ID" > ios/Flutter/Ads.xcconfig
          if [ -n "$FIREBASE_APP_ID_FILE_JSON" ]; then
            printf '%s' "$FIREBASE_APP_ID_FILE_JSON" > ios/firebase_app_id_file.json
          fi
      - name: Set version from tag
        script: |
          set -e
          # v1.2.3 -> 1.2.3. The build number is one past the highest one
          # already on TestFlight or Google Play, so both stores accept it.
          BUILD_NAME="${CM_TAG#v}"
          IOS_LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          ANDROID_LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" || echo 0)
          LATEST=$(( IOS_LATEST > ANDROID_LATEST ? IOS_LATEST : ANDROID_LATEST ))
          echo "BUILD_NAME=$BUILD_NAME" >> "$CM_ENV"
          echo "BUILD_NUMBER=$(( LATEST + 1 ))" >> "$CM_ENV"
      - name: Install dependencies
        script: flutter pub get
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=push.env.json \
            --dart-define-from-file=ads.env.json \
            --dart-define-from-file=app.env.json \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Build Android
        script: |
          flutter build appbundle --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=push.env.json \
            --dart-define-from-file=ads.env.json \
            --dart-define-from-file=app.env.json
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Play only accepts draft releases until the app's first release
        # is out. Set to false after that so builds go live on the track.
        submit_as_draft: true
