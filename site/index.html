<script>
  // Send visitors to the page in their language; English when none matches.
  (function () {
    var langs = ['ja', 'en'];
    var prefs = navigator.languages || [navigator.language || ''];
    for (var i = 0; i < prefs.length; i++) {
      var code = String(prefs[i]).toLowerCase().split('-')[0];
      if (langs.indexOf(code) >= 0) { location.replace('/' + code + '/'); return; }
    }
    location.replace('/en/');
  })();
</script>
