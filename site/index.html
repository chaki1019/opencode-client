<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Agent</title>
<link rel="alternate" hreflang="ja" href="https://opencodemobile.app/ja/">
<link rel="alternate" hreflang="en" href="https://opencodemobile.app/en/">
<link rel="alternate" hreflang="x-default" href="https://opencodemobile.app/">
<script>
  // Send visitors to the page in their language; English when none matches.
  (function () {
    var langs = ['ja', 'en'];
    var prefs = navigator.languages || [navigator.language || ''];
    for (var i = 0; i < prefs.length; i++) {
      var code = String(prefs[i]).toLowerCase().split('-')[0];
      if (langs.indexOf(code) >= 0) { location.replace('/' + code + '/'); return; }
    }
    location.replace('/en/');
  })();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
<h1>Pocket Agent</h1>
<ul>
  <li><a href="/ja/">日本語</a></li>
  <li><a href="/en/">English</a></li>
</ul>
</main>
</body>
</html>
