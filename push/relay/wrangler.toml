name = "opencode-push-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Served at relay.opencodemobile.app (the domain's DNS must be on Cloudflare).
# The workers.dev address keeps working for builds made before the switch.
routes = [{ pattern = "relay.opencodemobile.app", custom_domain = true }]
workers_dev = true
preview_urls = false

# Create with `npx wrangler d1 create opencode-push` and paste the id, then
# `npx wrangler d1 migrations apply opencode-push --remote`.
[[d1_databases]]
binding = "DB"
database_name = "opencode-push"
database_id = "0664a2cd-5ce5-47ca-b9f7-11b8ee5dcdcf"
migrations_dir = "migrations"

# Requests per client address, on every route.
[[ratelimits]]
name = "IP_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Notifications per pairing key.
[[ratelimits]]
name = "KEY_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Only for relays deployed before D1: keep the old KV binding until every
# pairing has been used once (each key moves to D1 the first time it is used).
# [[kv_namespaces]]
# binding = "DEVICES"
# id = "YOUR_OLD_KV_NAMESPACE_ID"

# Secret (not in this file): npx wrangler secret put FCM_SERVICE_ACCOUNT < service-account.json

# Ad switches served with /v1/app-version: JSON under the key `ads`, edited
# in the dashboard (Storage & Databases → KV → opencode-config) and live
# on the server within about a minute, no deploy. Create once with
# `npx wrangler kv namespace create opencode-config`, paste the id and
# uncomment. Without it the app keeps its built-in values. See docs/ads.md.
# [[kv_namespaces]]
# binding = "CONFIG"
# id = "YOUR_CONFIG_NAMESPACE_ID"

# Minimum app versions (GET /v1/app-version). Older apps are blocked until
# the user updates from the store URL. Leave a minimum empty to allow every
# version. Change them here and `npx wrangler deploy`, or edit the variables
# in the Cloudflare dashboard.
[vars]
MIN_VERSION_IOS = ""
MIN_VERSION_ANDROID = ""
STORE_URL_IOS = ""
STORE_URL_ANDROID = ""
